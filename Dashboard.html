<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>NiQuiTeen — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    /* Pulled from current system screenshot */
    --bg:        #0A1628;          /* page / app bg */
    --bg-2:      #0E1C33;          /* sidebar */
    --bg-3:      #122444;          /* row hover / divider */
    --line:      rgba(255,255,255,0.08);
    --line-2:    rgba(255,255,255,0.14);
    --ink:       #0B1220;          /* text on white cards */
    --ink-2:     #4A5772;          /* secondary text on white */
    --ink-3:     #8893AB;          /* tertiary on white */
    --on-dark:   #E6ECF5;
    --on-dark-2: #8A9AB8;
    --card:      #FFFFFF;
    --teal:      #5DDAD3;          /* logo */
    --teal-ink:  #0E5C57;
    --orange:    #FF7A45;          /* KPSK accent */
    --orange-2:  #FFE7DC;
    --danger:    #E5484D;
    --danger-bg: #FFF1F1;
    --danger-bd: #F4B6B6;
    --good:      #2E9E6E;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, Segoe UI, sans-serif;
    background: var(--bg);
    color: var(--on-dark);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "cv11","ss01";
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.18); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* layout */
  .app {
    display: grid;
    grid-template-columns: 248px 1fr;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    background: var(--bg-2);
    border-right: 1px solid var(--line);
    padding: 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 8px 18px 8px;
    border-bottom: 1px solid var(--line);
  }
  .brand-mark {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, #6FE6DF 0%, #4FC9C2 100%);
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(93,218,211,0.25), inset 0 0 0 1px rgba(255,255,255,0.25);
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: #0B3D3A;
    letter-spacing: -0.02em;
  }
  .brand-name { font-weight: 700; letter-spacing: -0.01em; font-size: 16px; }
  .brand-sub { font-size: 11px; color: var(--on-dark-2); margin-top: 1px; }

  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-section {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--on-dark-2);
    padding: 12px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--on-dark-2);
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    transition: background .15s, color .15s;
    border: 1px solid transparent;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: var(--on-dark); }
  .nav-item.active {
    background: rgba(93,218,211,0.10);
    color: var(--teal);
    border-color: rgba(93,218,211,0.22);
  }
  .nav-item .ic { width: 18px; height: 18px; flex: none; opacity: .9; }
  .nav-item.active .ic { opacity: 1; }

  .sidebar-foot {
    margin-top: auto;
    padding: 14px 12px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px;
    color: var(--on-dark-2);
    font-size: 12px;
  }
  .sidebar-foot .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(46,158,110,.18); }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--line);
    gap: 16px;
    background: linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
  }
  .crumb { color: var(--on-dark-2); font-size: 13px; }
  .crumb b { color: var(--on-dark); font-weight: 600; }
  .crumb .sep { margin: 0 8px; color: var(--on-dark-2); opacity: .6; }

  .topbar-right { display: flex; align-items: center; gap: 14px; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    width: 280px;
    color: var(--on-dark-2);
    font-size: 13px;
  }
  .search input { background: transparent; border: 0; outline: 0; color: var(--on-dark); width: 100%; font: inherit; }
  .search kbd {
    font: 11px/1 'JetBrains Mono', monospace;
    border: 1px solid var(--line-2);
    border-radius: 5px;
    padding: 3px 5px;
    color: var(--on-dark-2);
  }
  .me {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 6px 6px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
  }
  .me .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #FF7A45 0%, #E25A28 100%);
    color: #fff; font-weight: 700; font-size: 12px;
    display: grid; place-items: center;
    letter-spacing: 0.02em;
  }
  .me .who { font-size: 13px; }
  .me .who small { display: block; color: var(--on-dark-2); font-size: 11px; margin-top: 1px; }

  .page {
    padding: 26px 28px 36px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .page-title { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .page-title .accent { color: var(--orange); }
  .page-sub { color: var(--on-dark-2); font-size: 13px; margin-top: 4px; }
  .seg {
    display: inline-flex; padding: 4px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line); border-radius: 10px;
    gap: 2px;
  }
  .seg button {
    padding: 6px 12px; border-radius: 7px;
    font-size: 12.5px; color: var(--on-dark-2); font-weight: 500;
  }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 600; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .kpi {
    background: var(--card); color: var(--ink);
    border-radius: 14px;
    padding: 18px 20px 16px;
    border: 1px solid rgba(0,0,0,0.04);
    display: flex; flex-direction: column; gap: 6px;
    min-height: 124px;
    position: relative; overflow: hidden;
  }
  .kpi.danger { background: var(--danger-bg); border: 1px solid var(--danger-bd); }
  .kpi-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.10em; text-transform: uppercase;
    color: var(--ink-3);
    display: flex; align-items: center; gap: 8px;
  }
  .kpi.danger .kpi-label { color: #B5302A; }
  .kpi-value { font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .kpi-foot { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); margin-top: auto; }
  .delta { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-weight: 600; font-size: 11.5px; }
  .delta.up { background: #ECF8F1; color: var(--good); }
  .delta.down { background: #FFF1F1; color: var(--danger); }

  /* Master detail */
  .md {
    display: grid;
    grid-template-columns: minmax(380px, 460px) 1fr;
    gap: 14px;
    min-height: 540px;
  }
  .panel {
    background: var(--card); color: var(--ink);
    border-radius: 14px;
    border: 1px solid rgba(0,0,0,0.04);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-head {
    padding: 16px 18px 14px;
    border-bottom: 1px solid #EEF0F4;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .panel-head h3 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -0.005em; }
  .panel-head .sub { color: var(--ink-3); font-size: 12px; }
  .panel-head .hint { color: var(--ink-3); font-size: 11.5px; display: flex; align-items: center; gap: 6px; }
  .panel-head .hint svg { width: 12px; height: 12px; }

  /* Schools list (master) */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid #EEF0F4;
    background: #FBFBFD;
  }
  .toolbar .inp {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 1px solid #E6E8EE; border-radius: 9px;
    padding: 7px 10px; color: var(--ink-2); font-size: 13px;
  }
  .toolbar .inp input { background: transparent; border: 0; outline: 0; flex: 1; color: var(--ink); font: inherit; }
  .toolbar .sort {
    padding: 7px 10px; border-radius: 9px; border: 1px solid #E6E8EE;
    background: #fff; color: var(--ink-2); font-size: 12.5px; font-weight: 500;
    display: inline-flex; align-items: center; gap: 6px;
  }

  .school-list { flex: 1; overflow: auto; }
  .school {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    padding: 14px 18px;
    border-bottom: 1px solid #F1F2F6;
    cursor: pointer;
    transition: background .12s;
    position: relative;
  }
  .school:last-child { border-bottom: 0; }
  .school:hover { background: #FAFBFD; }
  .school.active { background: #FFF6F1; }
  .school.active::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
    background: var(--orange); border-radius: 0 3px 3px 0;
  }
  .school .name { font-weight: 600; font-size: 14px; color: var(--ink); }
  .school .meta {
    margin-top: 4px;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--ink-3);
  }
  .school .meta .dotsep { width: 3px; height: 3px; background: #C4C9D6; border-radius: 50%; }

  .quitbar {
    width: 110px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  .quitbar .pct {
    font-variant-numeric: tabular-nums;
    font-weight: 600; font-size: 13px; color: var(--ink);
  }
  .quitbar.warn .pct { color: var(--danger); }
  .quitbar.zero .pct { color: var(--ink-3); }
  .bar {
    width: 100px; height: 6px; background: #EFF1F6; border-radius: 999px; overflow: hidden;
  }
  .bar > i { display: block; height: 100%; background: var(--good); border-radius: inherit; }
  .quitbar.warn .bar > i { background: var(--danger); }
  .quitbar.mid  .bar > i { background: var(--orange); }
  .quitbar.zero .bar > i { background: #D6DBE6; width: 100%; opacity: .4; }

  /* Detail panel */
  .detail-head {
    padding: 16px 18px 14px;
    border-bottom: 1px solid #EEF0F4;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .detail-head h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .detail-head .meta { color: var(--ink-3); font-size: 12.5px; margin-top: 3px; }
  .detail-head .actions { display: flex; gap: 8px; }
  .btn {
    font-size: 12.5px; font-weight: 600;
    border-radius: 9px; padding: 8px 12px;
    border: 1px solid #E6E8EE; color: var(--ink);
    background: #fff;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #F7F8FB; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #1A2438; }

  .filterbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    background: #FBFBFD;
    border-bottom: 1px solid #EEF0F4;
    font-size: 12.5px;
    color: var(--ink-2);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
    background: #F1F3F8; color: var(--ink-2);
    border: 1px solid transparent;
    cursor: pointer;
  }
  .chip.on { background: #FFF1EA; color: #B14A1F; border-color: #FFD6C4; }
  .chip .count { color: var(--ink-3); font-weight: 600; }
  .chip.on .count { color: #B14A1F; }

  /* Users table */
  .users { flex: 1; overflow: auto; }
  table.tbl { width: 100%; border-collapse: collapse; }
  table.tbl thead th {
    text-align: left;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3);
    padding: 12px 18px;
    border-bottom: 1px solid #EEF0F4;
    background: #FBFBFD;
    position: sticky; top: 0; z-index: 1;
  }
  table.tbl tbody td {
    padding: 14px 18px;
    border-bottom: 1px solid #F2F3F7;
    font-size: 13.5px;
    vertical-align: middle;
  }
  table.tbl tbody tr:last-child td { border-bottom: 0; }
  table.tbl tbody tr:hover { background: #FAFBFD; }

  .user-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .avatar-sm {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    color: #4A2716; font-weight: 600; font-size: 12px;
    background: #FFE3D2;
    flex: none;
  }
  .avatar-sm.teal { background: #D2F4F1; color: #0E5C57; }
  .avatar-sm.gray { background: #E8EBF2; color: #4A5772; }
  .user-name { font-weight: 600; color: var(--ink); }
  .user-sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    text-transform: lowercase; letter-spacing: 0.01em;
  }
  .badge.quit { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-bd); }
  .badge.active { background: #ECF8F1; color: var(--good); border: 1px solid #BFE5CF; }
  .badge::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
  }

  .streak { font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 500; }
  .streak.muted { color: var(--ink-3); }
  .date { font-variant-numeric: tabular-nums; color: var(--ink-2); }

  .empty {
    padding: 60px 24px;
    text-align: center;
    color: var(--ink-3);
  }
  .empty .em-icon {
    width: 56px; height: 56px; border-radius: 14px;
    background: #F1F3F8; color: var(--ink-3);
    display: grid; place-items: center; margin: 0 auto 14px;
  }
  .empty h4 { color: var(--ink); margin: 0 0 6px; font-size: 15px; }

  .ic-btn {
    width: 28px; height: 28px; border-radius: 8px;
    display: inline-grid; place-items: center;
    color: var(--ink-3);
    border: 1px solid transparent;
  }
  .ic-btn:hover { background: #F1F3F8; color: var(--ink); border-color: #E6E8EE; }

  /* Footer note */
  .footnote {
    font-size: 12px;
    color: var(--on-dark-2);
    padding: 8px 4px 0;
  }

  @media (max-width: 1180px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .md { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; }
    .kpis { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useMemo } = React;

const totalUsers = SCHOOLS.reduce((s,x)=>s+x.users,0); // 24
const totalQuit  = SCHOOLS.reduce((s,x)=>s+x.quit,0);  // 7
const quitRate   = Math.round((totalQuit/totalUsers)*100);
const activeUsers = totalUsers - totalQuit;
const avgPerSchool = (totalUsers / SCHOOLS.length).toFixed(1);

/* ---------- Components ---------- */
function Sidebar({ active='dashboard', onNav }) {
  const items = [
    { id:'dashboard',  label:'Dashboard',     icon: I.dash  },
    { id:'patients',   label:'Manage Patient',icon: I.users },
    { id:'borang',     label:'Borang PPIM',   icon: I.form  },
    { id:'signout',    label:'Sign Out',      icon: I.out   },
  ];
  return (
    <aside className="sidebar">
      <div className="brand">
        <div className="brand-mark">N</div>
        <div>
          <div className="brand-name">NiQuiTeen</div>
          <div className="brand-sub">Quit-smoking program</div>
        </div>
      </div>
      <nav className="nav" aria-label="Primary">
        <div className="nav-section">Main</div>
        {items.slice(0,3).map(it=>{
          const Icon = it.icon;
          return (
            <a key={it.id} href="#" onClick={(e)=>{e.preventDefault(); onNav?.(it.id);}}
               className={"nav-item " + (active===it.id?'active':'')}>
              <Icon className="ic"/>
              <span>{it.label}</span>
            </a>
          );
        })}
        <div className="nav-section" style={{marginTop:10}}>Account</div>
        <a href="#" onClick={(e)=>e.preventDefault()} className="nav-item">
          <I.out className="ic"/><span>Sign Out</span>
        </a>
      </nav>
      <div className="sidebar-foot">
        <span className="dot"></span>
        All systems normal · v3.2
      </div>
    </aside>
  );
}

function Topbar() {
  return (
    <div className="topbar">
      <div className="crumb">
        <span>KKM Selangor</span>
        <span className="sep">›</span>
        <b>KP Sri Kembangan</b>
        <span className="sep">›</span>
        <span>Dashboard</span>
      </div>
      <div className="topbar-right">
        <div className="search">
          <I.search style={{width:14,height:14}}/>
          <input placeholder="Search schools, users, IC…"/>
          <kbd>⌘K</kbd>
        </div>
        <div className="me">
          <div className="avatar">KP</div>
          <div className="who">
            Hi, <b style={{color:'var(--orange)'}}>KPSK</b>
            <small>Klinik Pergigian, Sri Kembangan</small>
          </div>
          <I.chev style={{width:14,height:14,color:'var(--on-dark-2)'}}/>
        </div>
      </div>
    </div>
  );
}

function Kpi({ label, value, foot, delta, deltaDir, danger, accent }) {
  return (
    <div className={"kpi " + (danger ? 'danger':'')}>
      <div className="kpi-label">{label}</div>
      <div className="kpi-value" style={accent ? {color: accent}: null}>{value}</div>
      <div className="kpi-foot">
        {delta != null && (
          <span className={"delta " + (deltaDir==='up' ? (danger ? 'down' : 'up') : (danger ? 'up' : 'down'))}>
            {deltaDir==='up' ? <I.up style={{width:11,height:11}}/> : <I.down style={{width:11,height:11}}/>}
            {delta}
          </span>
        )}
        <span>{foot}</span>
      </div>
    </div>
  );
}

function QuitBar({ pct }) {
  const cls = pct >= 50 ? 'warn' : pct >= 20 ? 'mid' : pct === 0 ? 'zero' : '';
  return (
    <div className={"quitbar " + cls}>
      <div className="pct">{pct}%</div>
      <div className="bar"><i style={{ width: pct === 0 ? '100%' : pct + '%' }}/></div>
    </div>
  );
}

function SchoolsPanel({ schools, selectedId, onSelect, query, setQuery, sortKey, setSortKey }) {
  return (
    <div className="panel" data-screen-label="Schools master list">
      <div className="panel-head">
        <div>
          <h3>Schools</h3>
          <div className="sub">{schools.length} schools · {totalUsers} enrolled users</div>
        </div>
        <div className="hint"><I.arrow/> select a row</div>
      </div>
      <div className="toolbar">
        <div className="inp">
          <I.search style={{width:14,height:14}}/>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="Filter schools…"/>
        </div>
        <button className="sort" onClick={()=>setSortKey(sortKey==='quit'?'name':'quit')}>
          Sort: {sortKey==='quit' ? 'Quit rate' : 'Name'}
          <I.chev style={{width:12,height:12}}/>
        </button>
      </div>
      <div className="school-list">
        {schools.map(s => {
          const pct = s.users ? Math.round((s.quit/s.users)*100) : 0;
          return (
            <div
              key={s.id}
              className={"school " + (s.id===selectedId ? 'active' : '')}
              onClick={()=>onSelect(s.id)}
            >
              <div>
                <div className="name">{s.name}</div>
                <div className="meta">
                  <span>{s.users} users</span>
                  <span className="dotsep"/>
                  <span>{s.quit} quit</span>
                </div>
              </div>
              <QuitBar pct={pct}/>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function StatusBadge({ s }) {
  return s === 'quit'
    ? <span className="badge quit">quit</span>
    : <span className="badge active">active</span>;
}

function UsersPanel({ school, filter, setFilter }) {
  const all = USERS_BY_SCHOOL[school.id] || [];
  const counts = {
    all: all.length,
    active: all.filter(u=>u.status==='active').length,
    quit: all.filter(u=>u.status==='quit').length,
  };
  const list = filter === 'all' ? all : all.filter(u=>u.status===filter);

  return (
    <div className="panel" data-screen-label="Selected school detail">
      <div className="detail-head">
        <div>
          <h3>{school.name}</h3>
          <div className="meta">
            {school.users} enrolled · {school.quit} quit · {school.users? Math.round((school.quit/school.users)*100):0}% rate
          </div>
        </div>
        <div className="actions">
          <button className="btn"><I.dl style={{width:14,height:14}}/> Export</button>
          <button className="btn primary"><I.plus style={{width:14,height:14}}/> Add patient</button>
        </div>
      </div>
      <div className="filterbar">
        <span>Show:</span>
        {[
          ['all','All users', counts.all],
          ['active','Active', counts.active],
          ['quit','Quit', counts.quit],
        ].map(([k,label,n])=>(
          <button key={k} className={"chip " + (filter===k?'on':'')} onClick={()=>setFilter(k)}>
            {label} <span className="count">{n}</span>
          </button>
        ))}
        <div style={{marginLeft:'auto', color:'var(--ink-3)', display:'inline-flex', alignItems:'center', gap:6}}>
          <I.info style={{width:13,height:13}}/> click a row for full record
        </div>
      </div>
      <div className="users">
        {list.length === 0 ? (
          <div className="empty">
            <div className="em-icon"><I.empty style={{width:24,height:24}}/></div>
            <h4>No users match this filter</h4>
            <div>Try switching the filter above to see other patients.</div>
          </div>
        ) : (
          <table className="tbl">
            <thead>
              <tr>
                <th style={{width:'42%'}}>Patient</th>
                <th>Status</th>
                <th>Smoke-free</th>
                <th>Last update</th>
                <th style={{width:40}}></th>
              </tr>
            </thead>
            <tbody>
              {list.map((u,i)=>(
                <tr key={i}>
                  <td>
                    <div className="user-cell">
                      <div className={"avatar-sm " + (u.status==='quit' ? '' : (i%2 ? 'teal':'gray'))}>{u.initials}</div>
                      <div style={{minWidth:0}}>
                        <div className="user-name">{u.name}</div>
                        <div className="user-sub">Form {u.form} · ID {(1000+i*37).toString(16).toUpperCase()}</div>
                      </div>
                    </div>
                  </td>
                  <td><StatusBadge s={u.status}/></td>
                  <td>
                    <span className={"streak " + (u.status==='quit' ? '' : 'muted')}>
                      {u.streak} days
                    </span>
                  </td>
                  <td><span className="date">{u.status==='quit' ? u.quitOn : u.enrolled}</span></td>
                  <td><button className="ic-btn" aria-label="More"><I.more style={{width:16,height:16}}/></button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState('dashboard');
  const [selectedId, setSelectedId] = useState('s2'); // SMK Taman Desaminium
  const [query, setQuery] = useState('');
  const [sortKey, setSortKey] = useState('quit');
  const [filter, setFilter] = useState('all');
  const [range, setRange] = useState('30d');

  const filteredSchools = useMemo(() => {
    let arr = SCHOOLS.filter(s => s.name.toLowerCase().includes(query.toLowerCase()));
    if (sortKey === 'quit') {
      arr = [...arr].sort((a,b)=>{
        const ra = a.users? a.quit/a.users : 0;
        const rb = b.users? b.quit/b.users : 0;
        return rb - ra;
      });
    } else {
      arr = [...arr].sort((a,b)=>a.name.localeCompare(b.name));
    }
    return arr;
  }, [query, sortKey]);

  const selected = SCHOOLS.find(s=>s.id===selectedId) || SCHOOLS[0];

  return (
    <div className="app">
      <Sidebar active={active} onNav={setActive}/>
      <main className="main">
        <Topbar/>
        <div className="page">
          <div className="page-head">
            <div>
              <h1 className="page-title">
                Dashboard — <span className="accent">KP Sri Kembangan</span>
              </h1>
              <div className="page-sub">Overview of patients enrolled in the school-based quit-smoking program.</div>
            </div>
            <div className="seg" role="tablist" aria-label="Range">
              {[['7d','7 days'],['30d','30 days'],['90d','90 days'],['ytd','YTD']].map(([k,l])=>(
                <button key={k} className={range===k?'on':''} onClick={()=>setRange(k)}>{l}</button>
              ))}
            </div>
          </div>

          <div className="kpis">
            <Kpi label="Total users"     value={totalUsers}   foot="across 6 schools"
                 delta="+3"  deltaDir="up"/>
            <Kpi label="Active patients" value={activeUsers}  foot="still smoke-free"
                 delta="+1"  deltaDir="up"/>
            <Kpi label="Quit users"      value={totalQuit}    foot={quitRate + "% overall quit rate"}
                 delta="+2"  deltaDir="up" danger/>
            <Kpi label="Avg per school"  value={avgPerSchool} foot="patients per school"
                 delta="-0.2" deltaDir="down"/>
          </div>

          <div className="md">
            <SchoolsPanel
              schools={filteredSchools}
              selectedId={selectedId}
              onSelect={setSelectedId}
              query={query} setQuery={setQuery}
              sortKey={sortKey} setSortKey={setSortKey}
            />
            <UsersPanel
              school={selected}
              filter={filter} setFilter={setFilter}
            />
          </div>

          <div className="footnote">
            Last sync 5 min ago · Data scope: patients under KP Sri Kembangan only · Records comply with PDPA 2010.
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
